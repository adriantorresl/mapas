<!DOCTYPE html>
<html>
  <head>
    <title>Test Raster Loading</title>
  </head>
  <body>
    <h1>Test Raster Loading</h1>
    <div id="result"></div>

    <script>
      async function testRasterLoad() {
        const resultDiv = document.getElementById("result");

        try {
          console.log("Testing raster file access...");
          const response = await fetch("/PENDIENTE.tif");

          if (response.ok) {
            const buffer = await response.arrayBuffer();
            resultDiv.innerHTML = `✅ Success! PENDIENTE.tif loaded. Size: ${buffer.byteLength} bytes`;
            console.log(
              "Raster loaded successfully:",
              buffer.byteLength,
              "bytes"
            );
          } else {
            resultDiv.innerHTML = `❌ Error: HTTP ${response.status} - ${response.statusText}`;
            console.error(
              "Failed to load raster:",
              response.status,
              response.statusText
            );
          }
        } catch (error) {
          resultDiv.innerHTML = `❌ Error: ${error.message}`;
          console.error("Error loading raster:", error);
        }
      }

      testRasterLoad();
    </script>
  </body>
</html>
